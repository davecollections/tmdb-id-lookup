name: Update TMDB TV Network Details From Export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe operation mode
        required: true
        default: plan
        type: choice
        options: [plan, collect, sample, retry, network-bootstrap, validate, publish]
      slice_index:
        description: Zero-based Network slice
        required: true
        default: "0"
      sample_ids:
        description: Comma-separated Network IDs; required for sample mode
        required: false
      max_requests:
        description: Maximum Network API attempts
        required: true
        default: "1000"
      requested_month:
        description: UTC month (blank means current)
        required: false

jobs:
  network:
    permissions:
      contents: write
    uses: ./.github/workflows/monthly-network-refresh.yml
    with:
      mode: ${{ inputs.mode }}
      slice_index: ${{ inputs.slice_index }}
      sample_ids: ${{ inputs.sample_ids }}
      max_requests: ${{ inputs.max_requests }}
      requested_month: ${{ inputs.requested_month }}
    secrets: inherit
