name: Entity Count Recovery Fixture Producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-fixture-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: fixture
        name: Create fixture-only interruption artifact
        env:
          DRILL_OUTPUT_ROOT: ${{ runner.temp }}/entity-count-recovery-drill-upload
        run: node scripts/entity-count-recovery-drill.mjs produce
      - id: upload
        name: Upload real fixture artifact before interruption
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fixture.outputs.artifact_name }}
          path: ${{ steps.fixture.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
      - name: Simulate interruption after durable upload and before commit
        if: steps.upload.outcome == 'success'
        run: |
          echo "Fixture interruption is intentional; no repository write was attempted."
          exit 1
