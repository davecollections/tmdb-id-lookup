name: Monthly TMDB Network Refresh

on:
  workflow_call:
    inputs:
      mode: { required: true, type: string }
      slice_index: { required: true, type: string }
      max_requests: { required: true, type: string }
      requested_month: { required: false, type: string, default: "" }
    secrets:
      TMDB_BEARER_TOKEN: { required: true }
  workflow_dispatch:
    inputs:
      mode:
        description: Safe catalogue operation mode
        required: true
        default: plan
        type: choice
        options: [plan, collect, validate]
      slice_index:
        description: Zero-based slice override
        required: true
        default: "0"
      max_requests:
        description: Maximum Network API attempts
        required: true
        default: "15000"
      requested_month:
        description: UTC month (blank means current; collection cannot be backdated)
        required: false
  schedule:
    - cron: "45 8 1,2 * *"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      scheduled: ${{ steps.plan.outputs.scheduled }}
      planned_month: ${{ steps.plan.outputs.planned_month }}
      planned_utc_date: ${{ steps.plan.outputs.planned_utc_date }}
      slice_index: ${{ steps.plan.outputs.slice_index }}
      allocations: ${{ steps.plan.outputs.allocations }}
      request_bindings: ${{ steps.plan.outputs.request_bindings }}
      collection_allowance: ${{ steps.plan.outputs.collection_allowance }}
      target_export_allowance: ${{ steps.plan.outputs.target_export_allowance }}
      requires_requests: ${{ steps.plan.outputs.requires_requests }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          CATALOGUE_RUN_KIND: network-series
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode || github.event.inputs.mode || 'plan' }}
          INPUT_SLICE: ${{ inputs.slice_index || github.event.inputs.slice_index || '0' }}
          INPUT_MAX_REQUESTS: ${{ inputs.max_requests || github.event.inputs.max_requests || '15000' }}
          INPUT_MONTH: ${{ inputs.requested_month || github.event.inputs.requested_month || '' }}
        run: node scripts/plan-tmdb-catalogue-run.mjs

  reserve-requests:
    if: needs.plan.outputs.requires_requests == 'true' && needs.plan.outputs.skip != 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tmdb-request-budget
      cancel-in-progress: false
    outputs:
      reservation_id: ${{ steps.reserve.outputs.reservation_id }}
      reservation_path: ${{ steps.reserve.outputs.reservation_path }}
      reservation_sha256: ${{ steps.reserve.outputs.reservation_sha256 }}
      utc_date: ${{ steps.reserve.outputs.utc_date }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: reserve
        env:
          RESERVATION_JOB: network-series
          RESERVATION_PLANNED_MONTH: ${{ needs.plan.outputs.planned_month }}
          RESERVATION_PLANNED_UTC_DATE: ${{ needs.plan.outputs.planned_utc_date }}
          REQUEST_ALLOCATIONS_JSON: ${{ needs.plan.outputs.allocations }}
          REQUEST_BINDINGS_JSON: ${{ needs.plan.outputs.request_bindings }}
        run: node scripts/reserve-tmdb-request-budget.mjs
      - uses: ./.github/actions/commit-maintenance-state
        with:
          message: Reserve monthly Network TMDB requests
          paths: ${{ steps.reserve.outputs.reservation_path }}

  refresh-network-catalogue:
    if: needs.plan.outputs.requires_requests == 'true' && needs.plan.outputs.skip != 'true'
    needs: [plan, reserve-requests]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    concurrency:
      group: tmdb-catalogue-network
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh Network catalogue and legacy Series totals
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          MODE: ${{ needs.plan.outputs.mode }}
          SCHEDULED_RUN: ${{ needs.plan.outputs.scheduled }}
          COUNT_MONTH: ${{ needs.plan.outputs.planned_month }}
          SLICE_INDEX: ${{ needs.plan.outputs.slice_index }}
          TOTAL_SLICES: 2
          REQUEST_DELAY_MS: 120
          TMDB_RESERVATION_ID: ${{ needs.reserve-requests.outputs.reservation_id }}
          TMDB_RESERVATION_PATH: ${{ needs.reserve-requests.outputs.reservation_path }}
          TMDB_RESERVATION_SHA256: ${{ needs.reserve-requests.outputs.reservation_sha256 }}
          TMDB_RESERVATION_UTC_DATE: ${{ needs.plan.outputs.planned_utc_date }}
          TMDB_ALLOCATION_KEY: collection
          TMDB_REQUEST_CLASS: network-series
          TMDB_TARGET_DIMENSION: network-series
          TMDB_APPROVED_ALLOWANCE: ${{ needs.plan.outputs.collection_allowance }}
          TMDB_COLLECTION_ALLOWANCE: ${{ needs.plan.outputs.collection_allowance }}
          TMDB_TARGET_EXPORT_ALLOWANCE: ${{ needs.plan.outputs.target_export_allowance }}
        run: node scripts/fetch-tv-network-details-from-export.mjs
      - uses: ./.github/actions/commit-maintenance-state
        with:
          message: Refresh TMDB Network catalogue and legacy totals
          paths: |
            data/tv-networks.min.json
            data/tv-networks.csv
            data/tv-network-scan-meta.json
            data/tv-network-export.json
            maintenance/tmdb-request-budget/${{ needs.reserve-requests.outputs.utc_date }}/usage

  validate-network-catalogue:
    if: needs.plan.outputs.mode == 'validate' && needs.plan.outputs.skip != 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Network catalogue configuration without requests
        env:
          MODE: validate
          COUNT_MONTH: ${{ needs.plan.outputs.planned_month }}
          SLICE_INDEX: ${{ needs.plan.outputs.slice_index }}
          TOTAL_SLICES: 2
        run: node scripts/fetch-tv-network-details-from-export.mjs
