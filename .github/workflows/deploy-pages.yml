name: Deploy GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "maintenance/tmdb-request-budget/**"

  workflow_run:
    workflows:
      - Refresh TMDB Keyword Catalogue
      - Update TMDB Genre Counts
      - Monthly TMDB Company Refresh
      - Monthly TMDB Network Refresh
      - Manual Company Rebuild From Export
      - Update TMDB TV Network Details From Export
      - Repair Cache From Audit
      - Daily Capped Repair Cache From Audit
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Restore validated keyword data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tmdb-keyword-catalogue.mjs

      - name: Build builder
        run: npm run build --prefix builder

      - name: Generate asset version
        run: echo "APP_ASSET_VERSION=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Inject frontend config
        run: |
          sed -i "s|__APP_ASSET_VERSION__|${APP_ASSET_VERSION}|g" js/config.js
          sed -i "s|__APP_ASSET_VERSION__|${APP_ASSET_VERSION}|g" index.html

      - name: Prepare combined Pages artifact
        run: node scripts/prepare-pages-site.mjs

      - name: Validate combined Pages artifact
        run: node scripts/validate-pages-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
