name: Daily Capped Repair Cache From Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Audit TMDB Export Coverage
    types:
      - completed

jobs:
  repair:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/repair-cache-from-audit.yml
    with:
      mode: collect
      max_company_ids: "200"
      max_network_ids: "200"
    secrets: inherit
