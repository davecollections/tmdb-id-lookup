name: Manual Company Rebuild From Export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe operation mode
        required: true
        default: plan
        type: choice
        options: [plan, collect, sample, retry, validate, publish]
      slice_index:
        description: Zero-based slice
        required: true
        default: "0"
      sample_ids:
        description: Comma-separated Company IDs; required for sample mode
        required: false
      max_requests:
        description: Maximum Company API attempts
        required: true
        default: "1000"
      requested_month:
        description: UTC month (blank means current)
        required: false

jobs:
  company:
    permissions:
      contents: write
    uses: ./.github/workflows/monthly-company-refresh.yml
    with:
      mode: ${{ inputs.mode }}
      slice_index: ${{ inputs.slice_index }}
      sample_ids: ${{ inputs.sample_ids }}
      max_requests: ${{ inputs.max_requests }}
      requested_month: ${{ inputs.requested_month }}
    secrets: inherit
