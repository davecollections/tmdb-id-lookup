name: Nuvio Contract Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Run frontend and Nuvio contract checks
        env:
          DEVTOOLS_STARTUP_MS: "30000"
        run: node scripts/check-all.mjs

      - name: Build builder
        run: npm run build --prefix builder

      # Generated data is bootstrapped after merge. This workflow never deploys;
      # deploy-pages.yml restores and strictly validates the catalogue separately.
      - name: Prepare combined artifact for code review
        run: node scripts/prepare-pages-site.mjs --code-only

      - name: Validate combined Pages artifact
        run: node scripts/validate-pages-site.mjs --code-only
