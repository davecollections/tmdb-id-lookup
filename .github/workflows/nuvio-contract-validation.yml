name: Nuvio Contract Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Only newer commits to the same PR supersede a run. Every other event is unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      source: ${{ steps.route.outputs.source }}
      workspace: ${{ steps.route.outputs.workspace }}
      artwork: ${{ steps.route.outputs.artwork }}
    steps:
      - name: Checkout exact event with complete history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Plan required validation
        id: route
        run: node scripts/plan-validation.mjs

  core:
    name: Core and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Restore validated keyword data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tmdb-keyword-catalogue.mjs

      - name: Run core validation
        env:
          DEVTOOLS_STARTUP_MS: "30000"
        run: node scripts/check-all.mjs --group core

      - name: Build builder
        run: npm run build --prefix builder

      # Catalogue data is restored for validation; this workflow does not deploy.
      # Pages restores and strictly validates the catalogue separately for deployment.
      - name: Prepare combined artifact for code review
        run: node scripts/prepare-pages-site.mjs --code-only

      - name: Validate combined Pages artifact
        run: node scripts/validate-pages-site.mjs --code-only

  source:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.source == 'true' }}
    name: Source, hierarchy and live Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Restore validated keyword data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tmdb-keyword-catalogue.mjs

      - name: Run source validation
        env:
          DEVTOOLS_STARTUP_MS: "30000"
        run: node scripts/check-all.mjs --group source

  workspace:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.workspace == 'true' }}
    name: Bulk Edit, Import, Export and Send
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Restore validated keyword data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tmdb-keyword-catalogue.mjs

      - name: Run workspace validation
        env:
          DEVTOOLS_STARTUP_MS: "30000"
        run: node scripts/check-all.mjs --group workspace

  artwork:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.artwork == 'true' }}
    name: Folder artwork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install builder dependencies
        run: npm ci --prefix builder

      - name: Restore validated keyword data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-tmdb-keyword-catalogue.mjs

      - name: Run artwork validation
        env:
          DEVTOOLS_STARTUP_MS: "30000"
        run: node scripts/check-all.mjs --group artwork

  # Preserve the original check name for review and any required-check settings.
  validate:
    if: ${{ always() }}
    needs: [plan, core, source, workspace, artwork]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Require planned validation to succeed
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_PLAN: ${{ needs.plan.outputs.plan }}
          VALIDATION_EVENT_NAME: ${{ github.event_name }}
          VALIDATION_EVENT_SHA: ${{ github.sha }}
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-ci-results.mjs
