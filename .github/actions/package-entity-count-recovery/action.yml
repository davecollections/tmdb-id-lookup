name: Package typed count recovery output
description: Validate and durably upload one completed typed writer output before push

inputs:
  workload:
    description: Static typed writer workload identifier
    required: true
  progress-path:
    description: Exact typed progress file written by the collector
    required: true
  usage-path:
    description: Exact TMDB usage receipt written by the collector
    required: true
  reservation-path:
    description: Exact committed reservation receipt used by the collector
    required: true
  output-root:
    description: Runner temporary directory outside the checkout
    required: true

outputs:
  ready:
    description: Whether a positive-consumption recovery artifact was uploaded
    value: ${{ steps.package.outputs.ready }}
  artifact-name:
    description: Immutable recovery artifact name
    value: ${{ steps.package.outputs.artifact_name }}
  package-path:
    description: Temporary package path outside the checkout
    value: ${{ steps.package.outputs.package_path }}
  manifest-path:
    description: Canonical manifest used to protect the normal commit bytes
    value: ${{ steps.package.outputs.manifest_path }}
  artifact-digest:
    description: GitHub artifact archive SHA-256
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: package
      name: Validate and package exact writer output
      shell: bash
      env:
        RECOVERY_WORKLOAD: ${{ inputs.workload }}
        RECOVERY_PROGRESS_PATH: ${{ inputs.progress-path }}
        RECOVERY_USAGE_PATH: ${{ inputs.usage-path }}
        RECOVERY_RESERVATION_PATH: ${{ inputs.reservation-path }}
        RECOVERY_OUTPUT_ROOT: ${{ inputs.output-root }}
      run: node scripts/package-entity-count-recovery.mjs

    - id: upload
      name: Upload immutable recovery artifact
      if: steps.package.outputs.ready == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.package.outputs.artifact_name }}
        path: ${{ steps.package.outputs.package_path }}
        if-no-files-found: error
        retention-days: 90
        overwrite: false
        include-hidden-files: false

    - name: Record recovery artifact contract
      if: steps.package.outputs.ready == 'true'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
        ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
      run: |
        {
          echo "### Typed count recovery artifact"
          echo
          echo "- Name: \`$ARTIFACT_NAME\`"
          echo "- Requested retention: 90 days (repository policy may cap the API expiry)"
          echo "- Archive SHA-256: \`$ARTIFACT_DIGEST\`"
          echo "- Uploaded before the first output push"
        } >> "$GITHUB_STEP_SUMMARY"
